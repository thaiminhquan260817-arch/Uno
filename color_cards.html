<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Cards</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#15162b,#252653);font-family:Arial;color:#fff;text-align:center;min-height:100vh}
h1{margin:18px 0 5px;font-size:38px}.score{opacity:.8}.table{max-width:900px;margin:auto;padding:12px}.pile{display:flex;justify-content:center;gap:15px;align-items:center;min-height:190px}.card{width:76px;height:112px;border:4px solid #fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff;box-shadow:0 5px 12px #0006;cursor:pointer;user-select:none}.back{background:#222;cursor:default}.red{background:#e74c3c}.yellow{background:#f1c40f;color:#111}.green{background:#20a464}.blue{background:#3578e5}.hand{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:15px auto}.hand .card{width:64px;height:94px;font-size:24px;transition:.15s}.hand .card:hover{transform:translateY(-10px)}button{border:0;border-radius:12px;padding:12px 20px;font-weight:800;font-size:16px;margin:6px;cursor:pointer}.draw{background:#fff}.restart{background:#ff4d67;color:white}.msg{min-height:25px;font-weight:bold}.label{margin-top:8px;font-weight:bold}#colorBtns{display:none}footer{opacity:.5;margin:20px}
</style></head><body><div class="table"><h1>🃏 COLOR CARDS</h1><div class="score" id="score"></div><div class="label">🤖 Máy</div><div class="hand" id="bot"></div><div class="pile"><div class="card back">★</div><div id="top" class="card red">7</div></div><div class="msg" id="msg"></div><div class="hand" id="player"></div><button class="draw" onclick="draw()">Rút bài</button><button class="restart" onclick="start()">Chơi lại</button><div id="colorBtns"><button onclick="choose('red')">🔴</button><button onclick="choose('yellow')">🟡</button><button onclick="choose('green')">🟢</button><button onclick="choose('blue')">🔵</button></div><footer>Game bài phong cách riêng • Chơi trên iPad</footer></div>
<script>
const colors=['red','yellow','green','blue'];let deck=[],hand=[],bot=[],top,turn='player',chosen=null;
function makeDeck(){deck=[];for(const c of colors){for(let n=0;n<=9;n++){deck.push({c,n:String(n)});if(n>0)deck.push({c,n,String(n)});} }deck.push({c:'wild',n:'★'},{c:'wild',n:'+'});deck.push({c:'wild',n:'★'},{c:'wild',n:'+'});deck.sort(()=>Math.random()-.5)}
function card(x,click){let d=document.createElement('div');d.className='card '+(x.c==='wild'?'back':x.c);d.textContent=x.n; if(click)d.onclick=()=>play(x);return d}
function render(){document.getElementById('player').innerHTML='';hand.forEach(x=>document.getElementById('player').appendChild(card(x,true)));document.getElementById('bot').innerHTML=bot.map(()=>'<div class="card back">★</div>').join('');document.getElementById('top').className='card '+top.c;document.getElementById('top').textContent=top.n;document.getElementById('score').textContent=`Bạn: ${hand.length} lá  •  Máy: ${bot.length} lá  •  Lượt: ${turn==='player'?'Bạn':'Máy'}`}
function valid(x){return x.c==='wild'||x.c===top.c||x.n===top.n}
function play(x){if(turn!=='player'||!valid(x))return;hand.splice(hand.indexOf(x),1);top=x;if(x.c==='wild'){chosen=null;document.getElementById('colorBtns').style.display='block';document.getElementById('msg').textContent='Chọn màu!';render();return}afterPlayer()}
function choose(c){top.c=c;document.getElementById('colorBtns').style.display='none';afterPlayer()}
function afterPlayer(){if(hand.length===0)return end('🎉 Bạn thắng!');turn='bot';render();setTimeout(botPlay,650)}
function botPlay(){let i=bot.findIndex(valid);if(i<0){if(deck.length)bot.push(deck.pop());turn='player';msg('Máy rút bài. Đến lượt bạn!');render();return}top=bot.splice(i,1)[0];if(top.c==='wild')top.c=colors[Math.floor(Math.random()*4)];if(bot.length===0)return end('🤖 Máy thắng!');turn='player';msg('Máy đã đánh. Đến lượt bạn!');render()}
function draw(){if(turn!=='player')return;if(!deck.length)return;let x=deck.pop();hand.push(x);msg(valid(x)?'Bạn rút 1 lá. Bạn có thể đánh lá này.':'Bạn rút 1 lá.');render()}
function msg(t){document.getElementById('msg').textContent=t}
function end(t){turn='end';msg(t);render()}
function start(){makeDeck();hand=[];bot=[];for(let i=0;i<7;i++){hand.push(deck.pop());bot.push(deck.pop())}do{top=deck.pop()}while(top.c==='wild');turn='player';msg('Đánh một lá cùng màu hoặc cùng số.');document.getElementById('colorBtns').style.display='none';render()}
start();
</script></body></html>
